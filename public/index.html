<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Launcher</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Launcher</h1>
  <div class="toolbar">
    <label class="show-descriptions">
      <input type="checkbox" id="show-descriptions">
      Show descriptions
    </label>
    <label class="icon-size" id="icon-size-control" hidden>
      Icon size
      <input type="range" id="icon-size-slider" min="32" max="160" step="1">
      <input type="number" id="icon-size-number" min="32" max="160" step="1">
    </label>
    <label class="bg-color" id="day-bg-control" hidden>
      Day background
      <input type="color" id="day-bg-color">
    </label>
    <label class="bg-color" id="night-bg-control" hidden>
      Night background
      <input type="color" id="night-bg-color">
    </label>
    <button id="edit-toggle" type="button">Edit</button>
  </div>
</header>
<main id="grid" class="grid"></main>
<p id="empty-state" class="empty-state" hidden>No other webapps are installed on this server yet.</p>
<p id="login-redirect" class="empty-state" hidden>Signing in…</p>
<script src="app.js"></script>
</body>
</html>
