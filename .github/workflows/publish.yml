name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # enables OIDC trusted publishing — no NPM_TOKEN needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5 supports OIDC
      - run: npm ci
      - run: npm test
      - run: npm publish
